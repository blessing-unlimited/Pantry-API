name: Sync destination repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to destination
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add destination "https://x-access-token:${MIRROR_TOKEN}@github.com/blessing-unlimited/Pantry-API.git"
          git push --force destination HEAD:main
